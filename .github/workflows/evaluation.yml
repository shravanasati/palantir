name: Evaluation CI

on:
  push:
    branches: [ "**" ]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    
    - name: Create data directory
      run: mkdir -p data
    
    - name: Download movies dataset
      run: |
        curl -o data/movies.json https://storage.googleapis.com/qvault-webapp-dynamic-assets/course_assets/course-rag-movies.json
        echo "Movies dataset downloaded"
        ls -lh data/movies.json
    
    - name: Create stopwords file
      run: |
        cat > data/stopwords.txt << 'EOF'
        a
        an
        and
        are
        as
        at
        be
        but
        by
        for
        if
        in
        into
        is
        it
        no
        not
        of
        on
        or
        such
        that
        the
        their
        then
        there
        these
        they
        this
        to
        was
        will
        with
        EOF
        echo "Stopwords file created"
    
    - name: Create golden dataset
      run: |
        cat > data/golden_dataset.json << 'EOF'
        {
          "test_cases": [
            {
              "query": "sci-fi space adventure",
              "relevant_docs": ["Star Wars", "Star Trek", "Guardians of the Galaxy"]
            },
            {
              "query": "action movie with robots",
              "relevant_docs": ["Terminator", "Transformers", "The Matrix"]
            },
            {
              "query": "romantic comedy",
              "relevant_docs": ["Pretty Woman", "When Harry Met Sally", "Notting Hill"]
            }
          ]
        }
        EOF
        echo "Golden dataset created (placeholder)"
    
    - name: Install dependencies
      run: |
        uv sync
    
    - name: Download NLTK data
      run: |
        uv run python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"
    
    - name: Create cache directory
      run: mkdir -p cache
    
    - name: Cache embeddings and indexes
      uses: actions/cache@v4
      with:
        path: cache/
        key: ${{ runner.os }}-palantir-cache-${{ hashFiles('data/movies.json') }}
        restore-keys: |
          ${{ runner.os }}-palantir-cache-
    
    - name: Run evaluation with k=5
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        echo "Running evaluation with k=5..."
        uv run python cli/evaluation_cli.py -k 5
    
    - name: Run evaluation with k=10
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        echo "Running evaluation with k=10..."
        uv run python cli/evaluation_cli.py -k 10
